name: Agent implement

# Fires when a human applies the `ready-for-agent` label to an issue.
# That label is the authorisation gate: nothing here runs without it.
#
# Claude reads the issue and its agent brief, implements the change on its own
# branch, and opens a pull request linked to the issue. It cannot merge —
# claude-code-action has no merge capability, so "a human is the merge
# authority" is true by construction rather than by configuration.

on:
  issues:
    types: [labeled]

concurrency:
  # One run per issue, and never two runs racing on the same issue.
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Check the subscription token is present
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' and add it as a repository secret."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Consider implementing GitHub issue #${{ github.event.issue.number }} in this repository.

            First read the issue and every comment on it:
              gh issue view ${{ github.event.issue.number }} --comments

            STOP AND ESCALATE, WITHOUT WRITING ANY CODE, IF ANY OF THESE IS TRUE.
            Guessing is worse than stopping: a confident wrong change costs more
            to undo than a question costs to answer.

              (a) There is no comment headed "## Agent Brief".
              (b) The brief has no acceptance criteria, or they are too vague to
                  verify — you cannot tell, for a given input, whether you passed.
              (c) The criteria contradict each other, or contradict the code's
                  documented behaviour, and you would have to pick which one wins.
              (d) Doing the work would need information the issue does not contain,
                  such as which of several plausible behaviours is wanted.
              (e) The work touches credentials, secrets, deployment, database
                  migrations, billing, user data, or anything destructive.
              (f) The change would clearly be larger than one self-contained
                  change, and ought to be split into separate issues first.

            To escalate: post a comment on the issue saying exactly which of the
            above applies and what you would need in order to proceed — specific,
            answerable questions, not "please clarify". Then run:
              gh issue edit ${{ github.event.issue.number }} --add-label "needs-info" --remove-label "ready-for-agent"
            Then stop. Do not create a branch and do not open a pull request.
            Removing the label matters: it closes the authorisation gate, so the
            work cannot restart until a human reopens it.

            Otherwise, proceed.

            The comment headed "## Agent Brief" is the contract. Implement exactly
            what it specifies — no more. Honour its "Out of scope" list literally:
            if you notice an unrelated problem, mention it in the pull request body
            and leave the code alone.

            Follow the coding standards in AGENTS.md. In particular, every bug fix
            needs a test that fails against the current code and passes after your
            change. Write that test first and confirm it fails, so the test is
            proven to catch the bug rather than merely assumed to.

            Run `npm run check` and make sure it passes before you finish.

            Then commit to a new branch named `agent/issue-${{ github.event.issue.number }}`
            and open a pull request that says "Closes #${{ github.event.issue.number }}"
            in its body. In the body, list each acceptance criterion from the brief
            and state how you satisfied it.

            Do not merge the pull request. Do not modify any file under .github/.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
