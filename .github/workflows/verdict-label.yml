name: Verdict label

# Sets a pull request's state label from whatever verdict was posted, wherever
# it came from.
#
# This used to live inside the review workflow, which quietly assumed the
# reviewer was the cloud one. Pulling it out is what makes the reviewer
# genuinely swappable: a reviewer's whole contract is now "post a comment ending
# in TESTS_EXECUTED and VERDICT". Claude in a cloud runner, Codex on a laptop, a
# script, or a person typing the two lines by hand all satisfy it equally, and
# this station cannot tell the difference.
#
# It is plain shell on purpose. The state of a pull request is a fact to be read
# off, not a judgement, and a shell step either works or fails loudly.

on:
  issue_comment:
    types: [created]

concurrency:
  group: verdict-label-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'VERDICT:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Set the state label from the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          BODY=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.body | contains("VERDICT:"))] | last | .body // ""')

          VERDICT=$(echo "$BODY" | grep -oE 'VERDICT: (APPROVED|CHANGES_REQUESTED)' | tail -1 || true)
          RAN=$(echo "$BODY" | grep -oE 'TESTS_EXECUTED: (yes|no)' | tail -1 || true)

          # The risk lane. Missing counts as RED, not as GREEN — a reviewer that
          # forgot to classify is not evidence that a change is safe.
          RISK=$(echo "$BODY" | grep -oE 'RISK: (GREEN|YELLOW|RED)' | tail -1 || true)
          if [ -z "$RISK" ]; then RISK="RISK: RED"; echo "No risk lane stated; treating as RED."; fi

          # A verdict is only about the code it actually read. When a repair
          # lands after a review, the old verdict stays at the top of the pull
          # request and looks current — a stale verdict is indistinguishable
          # from a fresh one at a glance. This caught out a human within an hour
          # of the reviewer moving machines, so it is checked here rather than
          # left to whoever is reading.
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          SEEN=$(echo "$BODY" | grep -oE 'reviewed-commit: [0-9a-f]{7,40}' | tail -1 | awk '{print $2}' || true)

          if [ -n "$SEEN" ] && [ "${HEAD_SHA#$SEEN}" = "$HEAD_SHA" ]; then
            echo "The newest verdict judged $SEEN but the head is now $HEAD_SHA. Stale — leaving labels alone."
            gh pr edit "$PR" --remove-label "ready-for-human-merge" || true
            exit 0
          fi

          # Only the most recent completed run of the deterministic CI job counts.
          # The rollup keeps every historical run, and the reviewer is itself a
          # check — counting either would let old noise block the label forever.
          CI_BAD=$(gh pr view "$PR" --json statusCheckRollup --jq '
            [ .statusCheckRollup[]? | select(.name == "check" and .conclusion != null) ]
            | (if length == 0 then 1
               else ( max_by(.completedAt) | if .conclusion == "SUCCESS" then 0 else 1 end )
               end)')

          echo "verdict='$VERDICT'  risk='$RISK'  tests_executed='$RAN'  latest CI not green = $CI_BAD"

          if [ "$VERDICT" = "VERDICT: APPROVED" ] && [ "$RAN" != "TESTS_EXECUTED: yes" ]; then
            gh pr comment "$PR" --body "Approval not accepted: the reviewer did not confirm it ran the test suite (\`$RAN\`). An approval that could not be checked is not a merge signal." || true
            gh pr edit "$PR" --add-label "changes-requested" --remove-label "ready-for-human-merge" || true
            echo "Rejected an unverified approval."
          elif [ "$VERDICT" = "VERDICT: APPROVED" ] && [ "$CI_BAD" -eq 0 ] && [ "$RISK" = "RISK: RED" ]; then
            # An approval on a red-lane change is still only an opinion. Security,
            # migrations, public interfaces and money are where a confident review
            # is least trustworthy and a mistake is least recoverable — so the
            # merge-ready label is withheld and a human is required to read the
            # diff themselves. `ready-for-human-merge` is a label that invites you
            # not to look; that is fine for a typo and not fine for auth.
            gh pr edit "$PR" --add-label "needs-human-review" --remove-label "changes-requested" || true
            gh pr comment "$PR" --body "Reviewed and approved, but classified **RISK: RED** — architecture, a public interface, a migration, security, money or personal data. Approval is not enough on this lane. Someone has to read the diff before it merges." || true
            echo "Red lane: approved but withheld from the merge-ready label."
          elif [ "$VERDICT" = "VERDICT: APPROVED" ] && [ "$CI_BAD" -eq 0 ]; then
            gh pr edit "$PR" --add-label "ready-for-human-merge" --remove-label "changes-requested" || true
            echo "Labelled ready-for-human-merge. Nothing here can merge it; that is a human's job."
          elif [ "$VERDICT" = "VERDICT: CHANGES_REQUESTED" ]; then
            gh pr edit "$PR" --add-label "changes-requested" --remove-label "ready-for-human-merge" || true
            echo "Labelled changes-requested."
          else
            echo "No usable verdict, or CI is not green. Leaving labels alone."
          fi
