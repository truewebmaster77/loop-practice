name: Agent review

# Fires when a pull request appears or changes. Deterministic checks run first
# in ci.yml; this is the judgment gate that runs alongside them.
#
# The reviewer is a fresh run with no access to the implementer's reasoning.
# It sees only the ticket, the diff, and the test results — which is the
# property that stops a model agreeing with itself. It is forbidden from
# editing code: a reviewer that fixes things is a second author, and then
# nobody is checking the work.
#
# NOT THE ACTIVE REVIEWER ANY MORE. Codex reviews now, from the local machine,
# because the official OpenAI action needs a paid API key while `codex exec`
# runs on the ChatGPT subscription. See tools/local-review.ps1.
#
# This one is kept on manual dispatch so the two can be run against the same
# diff whenever that is worth checking. Nothing else in the line had to change
# when the reviewer moved off the cloud — the contract is "post a comment
# ending in TESTS_EXECUTED and VERDICT", and both honour it.

# Codex now reviews, from the local machine (see tools/local-review.ps1).
# This workflow is kept on manual dispatch so the two can be compared on the
# same diff whenever that is worth doing.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true

concurrency:
  group: agent-review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check the subscription token is present
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' and add it as a repository secret."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Install dependencies here rather than letting the reviewer do it. Two
      # reasons: installing is the workflow's job, not a reviewer's, and it
      # keeps `npm ci` out of the reviewer's allowlist — an install command can
      # execute arbitrary lifecycle scripts from the branch under review, which
      # is precisely the branch we do not trust yet.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The implementer opens its pull requests as the Claude app, and this
          # action refuses bot-triggered runs by default so that agents cannot
          # set each other off in a loop. A two-stage loop needs exactly one
          # such handoff, so allow that one bot by name — never "*".
          allowed_bots: "claude"
          prompt: |
            You are an independent reviewer. You did not write this code and you
            have not seen the author's reasoning. Judge the change on its own.

            Read the pull request and the issue it closes:
              gh pr view ${{ inputs.pr }}
              gh pr diff ${{ inputs.pr }}

            Find the linked issue number in the pull request body and read its
            agent brief:
              gh issue view <number> --comments

            Report along two separate axes, under two headings. Finish the first
            before starting the second, and do not let one colour the other — a
            clean diff can miss the point entirely, and a correct change can be
            written badly. They are different questions.

            ## SPEC — does it do what was asked? (blocking)

            1. Does the diff satisfy every acceptance criterion in the brief?
               Check each one individually and say so.
            2. Does the new test actually fail against the old code? VERIFY IT.
               Revert the source change, run the test, confirm it fails, restore.
               Report the exact failure message you saw. If a test bundles several
               cases into one block, only the first failure is actually observed —
               say so rather than inferring the rest.
            3. Did it touch anything the brief lists as out of scope?

            ## STANDARDS — is it written well? (blocking only where AGENTS.md says so)

            4. Does the change obey the documented standards in AGENTS.md? A
               documented standard is blocking.
            5. On top of that, check this fixed baseline of code smells. These are
               judgement calls, not rules, and they are NEVER blocking — report
               them as suggestions. A documented repo standard always wins over
               the baseline. Skip anything the linter or types already enforce.

               - Mysterious Name — a name that doesn't reveal what it does or holds.
               - Duplicated Code — the same logic shape in more than one place.
               - Feature Envy — a function reaching into another object's data
                 more than its own.
               - Data Clumps — the same few values always travelling together.
               - Primitive Obsession — a string or number standing in for a
                 domain concept that deserves its own type.
               - Repeated Switches — the same branch cascade on the same type,
                 recurring.
               - Shotgun Surgery — one logical change forcing scattered edits.
               - Divergent Change — one file edited for several unrelated reasons.
               - Speculative Generality — options, parameters or hooks added for
                 needs the brief does not have.
               - Message Chains — long `a.b().c().d()` navigation.
               - Middle Man — something that mostly just delegates onward.
               - Refused Bequest — an implementer ignoring most of what it inherits.

            Why non-blocking: a reviewer that blocks on style teaches the reader
            to skim past it, and then it has stopped being a gate at all. Block
            on what the brief and AGENTS.md require; advise on the rest.

            Do NOT edit any file. Do NOT commit. Do NOT merge. You are a judge,
            not an author. If something is wrong, say precisely what and where.

            WRITE YOUR REVIEW to the file `review.md` in the repository root. Do
            not post it yourself — a later step posts that file for you.
            Delivery is mechanical, and a mechanical step either works or fails
            loudly, whereas a model asked to deliver its own work tends to finish
            quietly having done everything except that. It has now happened three
            times on this repository.

            You must actually RUN the test suite. Reasoning about what the code
            would do is not verification, and an approval based on a hand-trace
            is indistinguishable from a real one once it is posted.

            End the file with exactly two lines, each on its own line:

              TESTS_EXECUTED: yes
              VERDICT: APPROVED

            `TESTS_EXECUTED` is `yes` only if you ran the suite yourself and saw
            the results. If anything stopped you — a denied command, a missing
            dependency, a broken environment — then it is `no`, and the verdict
            MUST be CHANGES_REQUESTED with the obstacle named as the blocking
            finding. Never approve work you could not check. Saying you were
            unable to verify is a useful result; approving anyway is not.

            The verdict line is one of:
              VERDICT: APPROVED
              VERDICT: CHANGES_REQUESTED

            When requesting changes, list each blocking finding with the file, the
            acceptance criterion or standard it violates, and the smallest change
            that would fix it. Mark anything non-blocking as a suggestion.
          # Two layers stop the reviewer becoming a second author.
          #
          # The job's `contents: read` permission means it cannot push anything,
          # so even a stray write dies with the runner. That is the real
          # protection. Below it is an allowlist: `dontAsk` denies everything not
          # named here, and no file-editing tool is named. Bash is narrowed to
          # the commands a reviewer genuinely needs — it must be able to revert
          # the source and re-run the tests to check that a new test really
          # catches the bug, so `git checkout`, `git show` and `npm` are in.
          # `git push`, `git commit`, `gh pr merge` and `gh api` are simply
          # absent, which denies them.
          # Bare and prefixed forms are both listed, because a trailing " *"
          # matches "npm test something" but not a bare "npm test". A denied
          # command is not a hard stop — the reviewer retries, and eight denials
          # were enough to burn a whole turn budget and produce no verdict at
          # all. Fail-closed is right; failing closed silently is not, which is
          # why the turn budget is now generous enough to leave a margin.
          # Wide shell, bounded blast radius. `contents: read` means nothing
          # written here can leave the runner, so narrowing the shell buys
          # little — and it cost a lot: an earlier narrow allowlist starved this
          # reviewer of the commands it needed and it burned its whole turn
          # budget on refusals. Reviewing a diff is exploratory work and the
          # commands cannot be guessed in advance. What matters is denied by
          # name instead.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Bash(git push:*)", "Bash(git push *)",
                  "Bash(git commit:*)", "Bash(git commit *)",
                  "Bash(gh pr merge:*)", "Bash(gh pr merge *)",
                  "Bash(gh pr edit:*)", "Bash(gh pr edit *)",
                  "Bash(gh pr close:*)", "Bash(gh pr close *)"
                ]
              }
            }
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash"

      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          if [ ! -s review.md ]; then
            echo "::error::The reviewer produced no review.md, so this pull request has no verdict and has not been reviewed. Treat this as a failure, not a quiet success."
            exit 1
          fi
          gh pr comment "$PR" --body-file review.md
          echo "Posted $(wc -c < review.md) bytes."
