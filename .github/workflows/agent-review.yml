name: Agent review

# Fires when a pull request appears or changes. Deterministic checks run first
# in ci.yml; this is the judgment gate that runs alongside them.
#
# The reviewer is a fresh run with no access to the implementer's reasoning.
# It sees only the ticket, the diff, and the test results — which is the
# property that stops a model agreeing with itself. It is forbidden from
# editing code: a reviewer that fixes things is a second author, and then
# nobody is checking the work.
#
# NOTE ON VENDOR: this reviews with Claude, in a separate run. The official
# OpenAI Codex action requires a paid API key and has no ChatGPT-subscription
# path, so cross-vendor review is not available on a subscription-only budget.
# If that changes, or if you accept API billing, swap this job for
# openai/codex-action@v1 — the surrounding contract does not change.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check the subscription token is present
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' and add it as a repository secret."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Install dependencies here rather than letting the reviewer do it. Two
      # reasons: installing is the workflow's job, not a reviewer's, and it
      # keeps `npm ci` out of the reviewer's allowlist — an install command can
      # execute arbitrary lifecycle scripts from the branch under review, which
      # is precisely the branch we do not trust yet.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The implementer opens its pull requests as the Claude app, and this
          # action refuses bot-triggered runs by default so that agents cannot
          # set each other off in a loop. A two-stage loop needs exactly one
          # such handoff, so allow that one bot by name — never "*".
          allowed_bots: "claude"
          prompt: |
            You are an independent reviewer. You did not write this code and you
            have not seen the author's reasoning. Judge the change on its own.

            Read the pull request and the issue it closes:
              gh pr view ${{ github.event.pull_request.number }}
              gh pr diff ${{ github.event.pull_request.number }}

            Find the linked issue number in the pull request body and read its
            agent brief:
              gh issue view <number> --comments

            Then answer only these questions:

            1. Does the diff satisfy every acceptance criterion in the brief?
               Check each one individually and say so.
            2. Does the new test actually fail against the old code? Verify it
               rather than trusting the description — revert the source change,
               run the test, confirm it fails, then restore.
            3. Does the change obey the coding standards in AGENTS.md?
            4. Did it touch anything the brief lists as out of scope?

            Do NOT edit any file. Do NOT commit. Do NOT merge. You are a judge,
            not an author. If something is wrong, say precisely what and where.

            Post your review as a comment on the pull request using:
              gh pr comment ${{ github.event.pull_request.number }} --body "..."

            You must actually RUN the test suite. Reasoning about what the code
            would do is not verification, and an approval based on a hand-trace
            is indistinguishable from a real one once it is posted.

            End the comment with exactly two lines, each on its own line:

              TESTS_EXECUTED: yes
              VERDICT: APPROVED

            `TESTS_EXECUTED` is `yes` only if you ran the suite yourself and saw
            the results. If anything stopped you — a denied command, a missing
            dependency, a broken environment — then it is `no`, and the verdict
            MUST be CHANGES_REQUESTED with the obstacle named as the blocking
            finding. Never approve work you could not check. Saying you were
            unable to verify is a useful result; approving anyway is not.

            The verdict line is one of:
              VERDICT: APPROVED
              VERDICT: CHANGES_REQUESTED

            When requesting changes, list each blocking finding with the file, the
            acceptance criterion or standard it violates, and the smallest change
            that would fix it. Mark anything non-blocking as a suggestion.
          # Two layers stop the reviewer becoming a second author.
          #
          # The job's `contents: read` permission means it cannot push anything,
          # so even a stray write dies with the runner. That is the real
          # protection. Below it is an allowlist: `dontAsk` denies everything not
          # named here, and no file-editing tool is named. Bash is narrowed to
          # the commands a reviewer genuinely needs — it must be able to revert
          # the source and re-run the tests to check that a new test really
          # catches the bug, so `git checkout`, `git show` and `npm` are in.
          # `git push`, `git commit`, `gh pr merge` and `gh api` are simply
          # absent, which denies them.
          # Bare and prefixed forms are both listed, because a trailing " *"
          # matches "npm test something" but not a bare "npm test". A denied
          # command is not a hard stop — the reviewer retries, and eight denials
          # were enough to burn a whole turn budget and produce no verdict at
          # all. Fail-closed is right; failing closed silently is not, which is
          # why the turn budget is now generous enough to leave a margin.
          claude_args: |
            --max-turns 40
            --permission-mode dontAsk
            --allowedTools "Read,Glob,Grep,Bash(git diff),Bash(git diff *),Bash(git show *),Bash(git log),Bash(git log *),Bash(git status),Bash(git status *),Bash(git checkout *),Bash(git stash),Bash(git stash *),Bash(git rev-parse *),Bash(git fetch),Bash(git fetch *),Bash(npm run *),Bash(npm test),Bash(npm test *),Bash(npx vitest),Bash(npx vitest *),Bash(node *),Bash(cat *),Bash(ls),Bash(ls *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *),Bash(gh issue view *)"

      # The labels are what a human scans, so they must never lie. This runs as
      # a plain shell step rather than being left to the reviewer, because the
      # state of the pull request is a fact to be read off, not a judgment.
      # `ready-for-human-merge` requires BOTH an approval and green checks —
      # deterministic tests and model judgment are separate gates and both have
      # to pass.
      - name: Set the pull request's state label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          VERDICT=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.body | contains("VERDICT:"))] | last | .body // ""' \
            | grep -oE 'VERDICT: (APPROVED|CHANGES_REQUESTED)' | tail -1 || true)

          # Gate on the deterministic CI job only, named `check` in ci.yml, and
          # only on its most recent completed run. Two traps here, both hit the
          # hard way: the rollup keeps every historical run for the commit, so
          # counting them all means one old failure blocks the label forever;
          # and this review workflow is itself a check, so counting it would
          # have the reviewer gating on its own past failures.
          FAILED=$(gh pr view "$PR" --json statusCheckRollup --jq '
            [ .statusCheckRollup[]? | select(.name == "check" and .conclusion != null) ]
            | (if length == 0 then 1
               else ( max_by(.completedAt) | if .conclusion == "SUCCESS" then 0 else 1 end )
               end)')

          # An approval from a reviewer that could not run the tests is not an
          # approval. This is enforced here rather than trusted to the prompt,
          # because the failure it guards against — a hand-traced approval —
          # reads exactly like a real one.
          RAN=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.body | contains("VERDICT:"))] | last | .body // ""' \
            | grep -oE 'TESTS_EXECUTED: (yes|no)' | tail -1 || true)

          echo "verdict='$VERDICT'  tests_executed='$RAN'  latest CI not green = $FAILED"

          if [ "$VERDICT" = "VERDICT: APPROVED" ] && [ "$RAN" != "TESTS_EXECUTED: yes" ]; then
            gh pr comment "$PR" --body "Approval not accepted: the reviewer did not confirm it ran the test suite (\`$RAN\`). An approval that could not be checked is not a merge signal. Labelling this as needing changes." || true
            gh pr edit "$PR" --add-label "changes-requested" --remove-label "ready-for-human-merge" || true
            echo "Rejected an unverified approval."
          elif [ "$VERDICT" = "VERDICT: APPROVED" ] && [ "$FAILED" -eq 0 ]; then
            gh pr edit "$PR" --add-label "ready-for-human-merge" --remove-label "changes-requested" || true
            echo "Labelled ready-for-human-merge. Nothing here can merge it; that is a human's job."
          elif [ "$VERDICT" = "VERDICT: CHANGES_REQUESTED" ]; then
            gh pr edit "$PR" --add-label "changes-requested" --remove-label "ready-for-human-merge" || true
            echo "Labelled changes-requested."
          else
            echo "No usable verdict, or checks are not green. Leaving labels alone."
          fi
