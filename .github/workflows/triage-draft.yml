name: Triage draft

# Fires when an issue is labelled `needs-triage`. Does the expensive part of
# triage — reproducing the problem against the real code — and drafts an agent
# brief for a human to check.
#
# IT DOES NOT AUTHORISE ANYTHING. It never applies `ready-for-agent`. That
# label is the loop's only gate, and the gate is not the label, it is a human
# deciding. A machine that both writes the brief and opens the gate has removed
# the checkpoint while leaving something that looks like one.
#
# The design comes from watching triage work by hand: reproducing the bug beat
# interrogating the reporter every time. "Some articles won't export" became
# four specific broken cases without asking the reporter anything. That is the
# part worth doing before a human ever looks.

on:
  issues:
    types: [labeled]

concurrency:
  group: triage-draft-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.event.label.name == 'needs-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read      # cannot push, cannot branch, cannot open a pull request
      issues: write       # comments only; label changes are excluded below
      id-token: write
    steps:
      - name: Check the subscription token is present
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run exactly this one command and nothing else:
              gh issue comment ${{ github.event.issue.number }} --body "Probe: tool use works in this workflow."
          claude_args: |
            --max-turns 5
            --allowedTools "Bash(gh issue comment *)"

      # Posting is mechanical, so a shell step does it. If the draft is missing
      # the job fails and says so, rather than ending green with nothing posted —
      # which is exactly what happened the first time this ran.
      - name: Post the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ ! -s triage-draft.md ]; then
            echo "::error::No triage-draft.md was produced, so there is nothing to post. The run did work but left no output — treat this as a failure, not a quiet success."
            exit 1
          fi
          gh issue comment "$ISSUE" --body-file triage-draft.md
          echo "Posted $(wc -c < triage-draft.md) bytes to issue #$ISSUE."
